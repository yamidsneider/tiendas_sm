<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIENDAS S.M – Sistema de gestión de tienda</title>
<style>
:root{
  --v900:#0a3b2a; --v800:#0f5a3f; --v700:#157a50; --v600:#1f9d63; --v500:#2fbf7a; --v300:#9af0c4; --v100:#e3f6ec; --v50:#f2f9f5;
  --fondo:#eef5f1; --tinta:#12332a; --tenue:#5d786d; --linea:#dbe8e1; --blanco:#fff;
  --ambar:#e08a00; --ambar-f:#fff3d9; --rojo:#d64545; --rojo-f:#fde7e7; --azul:#1f78a8; --azul-f:#e2f2fa;
  --sombra:0 2px 10px rgba(10,59,42,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--fondo);color:var(--tinta);display:flex;font-size:14px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--v500);outline-offset:2px;border-radius:6px}
.oculto{display:none!important}
.ocultar-visual{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* menú lateral */
.lateral{width:250px;background:linear-gradient(180deg,var(--v900) 0%,var(--v800) 100%);min-height:100vh;padding:18px 0;position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:20}
.lateral-cab{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.lateral-cab h1{color:#fff;font-size:21px;display:flex;align-items:center;gap:10px}
.lateral-cab h1::before{content:"🛒";font-size:26px}
.lateral-cab p{color:#a5cdbb;font-size:12px;margin-top:4px}
.grupo{color:#78ad95;font-size:11px;padding:14px 22px 6px;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 22px;color:#b8d9c8;border-left:3px solid transparent;transition:.2s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.activo{background:rgba(154,240,196,.1);color:var(--v300);border-left-color:var(--v300)}
.nav .icono{font-size:17px;width:22px;text-align:center}
.nav .etiqueta{margin-left:auto;background:var(--ambar);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.nav .etiqueta.roja{background:var(--rojo)}
.nav .cr{margin-left:auto;font-size:10px;border:1px solid #78ad95;color:#9fd1b9;border-radius:4px;padding:0 5px}
.lateral-pie{padding:14px 22px;color:#78ad95;font-size:11px;line-height:1.5}

/* contenido */
.principal{margin-left:250px;flex:1;padding:26px 30px 40px;min-height:100vh;min-width:0}
.encabezado{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.encabezado h2{font-size:26px;color:var(--v900)}
.encabezado p{color:var(--tenue);margin-top:4px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.aviso{background:var(--ambar-f);border-left:5px solid var(--ambar);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:18px}
.aviso.verde{background:var(--v100);border-left-color:var(--v600)}
.aviso.roja{background:var(--rojo-f);border-left-color:var(--rojo)}

/* botones */
.btn{padding:9px 18px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.2s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(31,157,99,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--v600),var(--v500));color:#fff}
.btn-s{background:var(--v100);color:var(--v800)}
.btn-o{border:1.5px solid var(--v600);color:var(--v700);background:#fff}
.btn-a{background:var(--ambar);color:#fff}
.btn-r{background:var(--rojo);color:#fff}
.btn-ch{padding:5px 11px;font-size:12px}
.tecla{font-size:10px;opacity:.8;border:1px solid currentColor;border-radius:4px;padding:0 4px}

/* tarjetas y rejilla */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px;margin-bottom:22px}
.kpi{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--sombra);transition:transform .25s}
.kpi:hover{transform:translateY(-3px)}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;background:var(--v100)}
.kpi .valor{font-size:26px;font-weight:700;color:var(--v900)}
.kpi .rotulo{color:var(--tenue);font-size:13px;margin-top:3px}
.kpi .nota{font-size:12px;margin-top:6px;color:var(--v700)}
.kpi.ambar .ic{background:var(--ambar-f)}.kpi.rojo .ic{background:var(--rojo-f)}.kpi.azul .ic{background:var(--azul-f)}
.kpi.rojo .nota{color:var(--rojo)}.kpi.ambar .nota{color:var(--ambar)}
.cols{display:grid;gap:18px;margin-bottom:20px}
.cols.c2{grid-template-columns:1fr 1fr}.cols.c21{grid-template-columns:2fr 1fr}.cols.c12{grid-template-columns:1fr 2fr}.cols.c3{grid-template-columns:repeat(3,1fr)}
.tarjeta{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:var(--sombra);min-width:0}
.tarjeta>h3,.tarjeta .cab h3{font-size:17px;color:var(--v900);margin-bottom:14px}
.tarjeta .cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tarjeta .cab h3{margin:0}
.nota-pie{color:var(--tenue);font-size:12px;margin-top:10px}

/* tablas */
.tabla-caja{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:var(--sombra);margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--tenue);font-weight:600;padding:10px 12px;border-bottom:2px solid var(--linea);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
tbody tr:hover{background:var(--v50)}
tr:last-child td{border-bottom:none}
.num{text-align:right}
.sec{color:var(--tenue);font-size:12px}
.insignia{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.i-ok{background:var(--v100);color:var(--v700)}.i-av{background:var(--ambar-f);color:#a86400}.i-mal{background:var(--rojo-f);color:var(--rojo)}.i-info{background:var(--azul-f);color:var(--azul)}.i-gris{background:#eceff0;color:#58666d}
.busca{padding:9px 14px;border:1.5px solid var(--linea);border-radius:8px;min-width:230px;background:#fff}
.busca:focus{border-color:var(--v600);outline:none}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{padding:6px 14px;border-radius:16px;border:1.5px solid var(--linea);background:#fff;font-size:13px}
.filtros button.sel{background:var(--v700);border-color:var(--v700);color:#fff}
.barra{height:10px;background:#e3ede8;border-radius:5px;position:relative;min-width:90px}
.barra>span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.barra>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}
.vacio{padding:26px;text-align:center;color:var(--tenue)}

/* punto de venta */
.pos{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
.pos-busca{position:relative}
.pos-fila{display:flex;gap:10px}
.pos-fila .grande{flex:1;font-size:17px;padding:13px 16px;border:2px solid var(--v600);border-radius:10px}
.pos-fila .cant{width:90px;font-size:17px;padding:13px;border:2px solid var(--linea);border-radius:10px;text-align:center}
.sugerencias{position:absolute;left:0;right:100px;top:100%;background:#fff;border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 24px rgba(10,59,42,.18);z-index:15;max-height:320px;overflow:auto;margin-top:4px}
.sugerencias button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid var(--linea)}
.sugerencias button:hover,.sugerencias button.sel{background:var(--v100)}
.ticket td,.ticket th{padding:9px 10px}
.cantidad-ctl{display:inline-flex;align-items:center;gap:6px}
.cantidad-ctl button{width:26px;height:26px;border-radius:50%;background:var(--v100);color:var(--v800);font-weight:700}
.total-caja{background:linear-gradient(160deg,var(--v800),var(--v600));color:#fff;border-radius:14px;padding:22px;box-shadow:var(--sombra)}
.total-caja .t{font-size:13px;opacity:.85}
.total-caja .m{font-size:44px;font-weight:700;line-height:1.15;margin:4px 0 6px}
.total-caja .s{font-size:13px;opacity:.85}
.pos-botones{display:grid;gap:10px;margin-top:14px}
.pos-botones .btn{justify-content:center;padding:14px;font-size:16px}
.btn-claro{background:#fff;color:var(--v800)}
.btn-claro:hover:not(:disabled){box-shadow:0 5px 14px rgba(0,0,0,.2)}

/* ventanas */
.velo{position:fixed;inset:0;background:rgba(7,40,28,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.ancho{max-width:760px}
.modal h3{font-size:20px;color:var(--v900);margin-bottom:16px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:8px;background:#fff}
.campo input:focus,.campo select:focus{border-color:var(--v600);outline:none}
.campo .ayuda{font-size:12px;color:var(--tenue);margin-top:4px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.modal-pie{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.error-caja{background:var(--rojo-f);color:#9c2a2a;border-left:4px solid var(--rojo);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.ok-caja{background:var(--v100);color:var(--v800);border-left:4px solid var(--v600);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.pestañas{display:flex;gap:6px;margin-bottom:16px}
.pestañas button{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--linea);font-weight:600}
.pestañas button.sel{background:var(--v700);border-color:var(--v700);color:#fff}
.papel{font-family:'Consolas','Courier New',monospace;background:#fbfdfc;border:1px dashed #9db8ac;border-radius:8px;padding:16px;font-size:13px}
.papel hr{border:none;border-top:1px dashed #9db8ac;margin:8px 0}
.papel .f{display:flex;justify-content:space-between;gap:10px}
.aviso-flotante{position:fixed;right:22px;bottom:22px;z-index:80;display:grid;gap:8px}
.aviso-flotante div{background:var(--v900);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:380px;animation:entra .25s}
.aviso-flotante div.mal{background:#9c2a2a}
@keyframes entra{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.lista-simple{list-style:none}
.lista-simple li{padding:9px 0;border-bottom:1px solid var(--linea);display:flex;gap:10px;align-items:flex-start}
.lista-simple li:last-child{border-bottom:none}
.lista-simple input{margin-top:3px;width:17px;height:17px;accent-color:var(--v600)}
.lista-simple .hecho label{text-decoration:line-through;color:var(--tenue)}
.lista-simple small{display:block;color:var(--tenue)}
svg text{font-family:'Segoe UI',sans-serif;fill:var(--tenue);font-size:11px}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tenue);margin-top:8px}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

@media(max-width:1100px){.cols.c2,.cols.c21,.cols.c12,.cols.c3,.pos{grid-template-columns:1fr}}
@media(max-width:900px){
  .lateral{width:64px}.lateral-cab h1{font-size:0}.lateral-cab h1::before{font-size:26px}.lateral-cab p,.nav .texto,.nav .cr,.grupo,.lateral-pie{display:none}
  .nav{padding:12px 0;justify-content:center}.nav .etiqueta{position:absolute;margin:-18px 0 0 18px}.principal{margin-left:64px;padding:18px 14px 30px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.lateral,.acciones,.modal-pie,.aviso-flotante{display:none!important}.principal{margin:0}.velo{position:static;background:none}.modal{box-shadow:none}}

</style>
</head>
<body>
<aside class="lateral">
  <div class="lateral-cab"><h1>TIENDAS S.M</h1><p>Inventario, ventas y créditos</p></div>
  <nav id="menu" aria-label="Módulos"></nav>
  <div class="lateral-pie">Prototipo con datos de ejemplo.<br>MVP académico · Ingeniería de Software I</div>
</aside>
<main class="principal" id="contenido"></main>
<script>
'use strict';
/* =====================================================================================
   LÓGICA DE NEGOCIO de TIENDAS S.M (sin pantalla). Refleja las reglas del código Python:
   stock, límite de crédito, abonos y "todo o nada". Todo opera sobre un objeto de estado E.
   ===================================================================================== */
let RELOJ = () => new Date();                       // las pruebas lo reemplazan
const z2 = n => String(n).padStart(2, '0');
const aISO = d => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
const hoyISO = () => aISO(RELOJ());
const horaHHMM = () => { const d = RELOJ(); return `${z2(d.getHours())}:${z2(d.getMinutes())}`; };
const masDias = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return aISO(new Date(y, m - 1, d + n)); };
const diasEntre = (a, b) => { const t = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((t(b) - t(a)) / 86400000); };
const clonar = o => JSON.parse(JSON.stringify(o));
const pesos = n => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Math.round(n));
const suma = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

class ErrorNegocio extends Error { constructor(mensaje, tipo = 'validacion') { super(mensaje); this.tipo = tipo; } }
const exigir = (cond, msg, tipo) => { if (!cond) throw new ErrorNegocio(msg, tipo); };
const entero = (v, nombre) => { const n = Number(v); exigir(Number.isInteger(n), `${nombre} debe ser un número entero`); return n; };
const cantidadPositiva = v => { const n = entero(v, 'La cantidad'); exigir(n > 0, 'La cantidad debe ser mayor a cero'); return n; };

/* ------------------------------ consultas ------------------------------ */
const prod = (E, id) => E.productos.find(p => p.id === id);
const cli = (E, id) => E.clientes.find(c => c.id === id);
const nuevoId = (E, clave) => ++E.sig[clave];
const stockDe = (E, p) => p.vence ? suma(E.lotes.filter(l => l.productoId === p.id), l => l.cantidad) : p.stock;
const lotesDe = (E, pid) => E.lotes.filter(l => l.productoId === pid && l.cantidad > 0).sort((a, b) => a.vence.localeCompare(b.vence));
const abonado = c => suma(c.abonos, a => a.valor);
const saldoDe = c => c.monto - abonado(c);
const saldoCliente = (E, cid) => suma(E.cuentas.filter(c => c.clienteId === cid), saldoDe);
const creditoDisponible = (E, c) => c.credito ? c.limite - saldoCliente(E, c.id) : 0;
function estadoCuenta(c) {
  if (saldoDe(c) === 0) return 'PAGADA';
  return diasEntre(hoyISO(), c.vence) < 0 ? 'VENCIDA' : 'ABIERTA';
}
function pendienteDePedido(E, pid) {
  return suma(E.pedidos.filter(p => p.estado === 'ENVIADO'), p => suma(p.lineas.filter(l => l.productoId === pid), l => l.cantidad));
}

/* ------------------------------ alertas (RF-12, RF-13, créditos) ------------------------------ */
function alertas(E) {
  const hoy = hoyISO();
  const stockBajo = E.productos.map(p => ({ producto: p, stock: stockDe(E, p), pendiente: pendienteDePedido(E, p.id) }))
    .filter(x => x.stock <= x.producto.minimo).sort((a, b) => (a.stock / (a.producto.minimo || 1)) - (b.stock / (b.producto.minimo || 1)));
  const porVencer = E.lotes.filter(l => l.cantidad > 0).map(l => ({ lote: l, producto: prod(E, l.productoId), dias: diasEntre(hoy, l.vence) }))
    .filter(x => x.dias <= E.config.diasAviso).sort((a, b) => a.dias - b.dias);
  const creditosVencidos = E.cuentas.filter(c => estadoCuenta(c) === 'VENCIDA')
    .map(c => ({ cuenta: c, cliente: cli(E, c.clienteId), dias: diasEntre(hoy, c.vence) })).sort((a, b) => a.dias - b.dias);
  return { stockBajo, porVencer, creditosVencidos, total: stockBajo.length + porVencer.length + creditosVencidos.length };
}

/* ------------------------------ ventas (RF-05, RF-06, RF-08) ------------------------------ */
function cantidadEnCarrito(carrito, pid) { return suma(carrito.filter(l => l.productoId === pid), l => l.cantidad); }
function totalCarrito(E, carrito) { return suma(carrito, l => l.cantidad * prod(E, l.productoId).precioVenta); }

/** Valida que se pueda tener `cantidadTotal` de un producto en el carrito. Mensaje igual al del código Python. */
function validarStock(E, pid, cantidadTotal) {
  const p = prod(E, pid); exigir(p, 'El producto no existe');
  const disponible = stockDe(E, p);
  exigir(cantidadTotal <= disponible, `Solo hay ${disponible} disponibles de ${p.nombre}`, 'stock');
}

/**
 * Registra una venta de contado o a crédito. TODO O NADA: trabaja sobre una copia del estado y solo
 * la devuelve si todo salió bien; si algo falla, el estado original no se toca (RNF-04).
 * `opciones.fallarAlFinal` sirve para simular una falla en las pruebas.
 */
function cobrarVenta(E, datos, opciones = {}) {
  const { carrito, tipo } = datos;
  exigir(carrito && carrito.length > 0, 'La venta no tiene productos');
  const S = clonar(E);
  const porProducto = {};
  carrito.forEach(l => { cantidadPositiva(l.cantidad); porProducto[l.productoId] = (porProducto[l.productoId] || 0) + l.cantidad; });
  Object.entries(porProducto).forEach(([pid, cant]) => validarStock(S, Number(pid), cant));
  const lineas = carrito.map(l => { const p = prod(S, l.productoId); return { productoId: p.id, codigo: p.codigo, nombre: p.nombre, cantidad: l.cantidad, precio: p.precioVenta, subtotal: l.cantidad * p.precioVenta }; });
  const total = suma(lineas, l => l.subtotal);

  const venta = { id: nuevoId(S, 'venta'), fecha: hoyISO(), hora: horaHHMM(), tipo, clienteId: null, medio: null, lineas, total };
  if (tipo === 'CREDITO') {
    const c = cli(S, datos.clienteId);
    exigir(c, 'Elige el cliente que se lleva la venta a crédito', 'credito');
    exigir(c.credito, `${c.nombre} no tiene crédito habilitado`, 'credito');
    const disp = creditoDisponible(S, c);
    exigir(total <= disp, `${c.nombre} no puede comprar a crédito por ${pesos(total)}: su crédito disponible es ${pesos(disp)}`, 'credito');
    venta.clienteId = c.id; venta.medio = 'CREDITO';
    const plazo = c.plazo || S.config.plazoDefecto;
    S.cuentas.push({ id: nuevoId(S, 'cuenta'), ventaId: venta.id, clienteId: c.id, monto: total, abonos: [], apertura: venta.fecha, vence: masDias(venta.fecha, plazo) });
  } else {
    const medio = datos.medio || 'EFECTIVO';
    venta.medio = medio;
    if (medio === 'EFECTIVO') exigir(Number(datos.recibido ?? total) >= total, `El efectivo recibido no alcanza para ${pesos(total)}`);
    if (medio === 'MIXTO') exigir(Number(datos.efectivo || 0) + Number(datos.transferencia || 0) === total, `En el pago mixto, efectivo + transferencia deben sumar ${pesos(total)}`);
    if (medio === 'MIXTO') { venta.efectivo = Number(datos.efectivo || 0); venta.transferencia = Number(datos.transferencia || 0); }
    if (datos.clienteId) venta.clienteId = Number(datos.clienteId);
  }
  Object.entries(porProducto).forEach(([pid, cant]) => {
    const p = prod(S, Number(pid)); descontarStock(S, p, cant);
    S.movimientos.push({ id: nuevoId(S, 'movimiento'), fecha: venta.fecha, hora: venta.hora, productoId: p.id, tipo: 'VENTA', cantidad: cant, nota: `Venta #${venta.id}` });
  });
  S.ventas.push(venta);
  if (opciones.fallarAlFinal) throw new ErrorNegocio('falla simulada al guardar');

  const tope = Math.max(50000, Math.ceil(Math.max(...tot) / 50000) * 50000), ancho = (W - m.i - m.d) / datos.length, alto = H - m.s - m.b, y = v => m.s + alto - (v / tope) * alto;
  let g = '';
  for (let t = 0; t <= tope; t += tope / 4) g += `<line x1="${m.i}" x2="${W - m.d}" y1="${y(t)}" y2="${y(t)}" stroke="#dbe8e1"/><text x="${m.i - 6}" y="${y(t) + 4}" text-anchor="end">${t === 0 ? '0' : Math.round(t / 1000) + ' mil'}</text>`;
  datos.forEach((d, i) => {
    const x = m.i + i * ancho + ancho * .2, w = ancho * .6, dia = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'][new Date(d.fecha + 'T12:00:00').getDay()];
    g += `<rect x="${x}" y="${y(d.contado)}" width="${w}" height="${m.s + alto - y(d.contado)}" fill="#1f9d63" rx="3"><title>${dia} ${fechaCorta(d.fecha)}: ${pesos(d.contado)} de contado</title></rect>`;
    g += `<rect x="${x}" y="${y(tot[i])}" width="${w}" height="${Math.max(0, y(d.contado) - y(tot[i]))}" fill="#e0a82e" rx="3"><title>${dia} ${fechaCorta(d.fecha)}: ${pesos(d.credito)} a crédito</title></rect>`;
    g += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle" ${i === datos.length - 1 ? 'style="font-weight:700;fill:#12332a"' : ''}>${i === datos.length - 1 ? 'Hoy' : dia}</text>`;
    if (tot[i] > 0) g += `<text x="${x + w / 2}" y="${y(tot[i]) - 5}" text-anchor="middle" style="fill:#12332a;font-weight:600">${Math.round(tot[i] / 1000)}k</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ventas diarias de contado y a crédito, últimos 7 días. Total ${pesos(suma(tot))}">${g}</svg>
    <div class="leyenda"><span><i style="background:#1f9d63"></i>De contado</span><span><i style="background:#e0a82e"></i>A crédito (fiado)</span><span>Total de 7 días: <b>${pesos(suma(tot))}</b></span></div>`;
}
function barrasHorizontales(pares, color = '#1f9d63') {
  if (!pares.length) return '<div class="vacio">Aún no hay ventas.</div>';
  const mayor = Math.max(...pares.map(p => p[1]));
  return pares.map(([n, v]) => `<div style="display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr 46px;gap:10px;align-items:center;margin:9px 0"><span>${esc(n)}</span><div class="barra"><span style="width:${v / mayor * 100}%;background:${color}"></span></div><b style="text-align:right">${v}</b></div>`).join('');
}
function dona(partes) {
  const total = suma(partes, p => p.v) || 1, r = 52, c = 2 * Math.PI * r; let acum = 0;
  const arcos = partes.map(p => { const largo = p.v / total * c, s = `<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${largo} ${c - largo}" stroke-dashoffset="${-acum}" transform="rotate(-90 70 70)"><title>${esc(p.n)}: ${pesos(p.v)}</title></circle>`; acum += largo; return s; }).join('');
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="150" role="img" aria-label="${partes.map(p => `${p.n}: ${Math.round(p.v / total * 100)}%`).join(', ')}">${arcos}<text x="70" y="75" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#12332a">${pesos(suma(partes, p => p.v))}</text></svg>
    <div>${partes.map(p => `<div style="margin:6px 0"><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${p.color};margin-right:8px"></i>${esc(p.n)}: <b>${Math.round(p.v / total * 100)}%</b></div>`).join('')}</div></div>`;
}

function buscarProductos(texto) {
  const n = normal(texto).trim(); if (!n) return [];
  const exacto = E.productos.filter(p => normal(p.codigo) === n); if (exacto.length) return exacto;
  return E.productos.filter(p => normal(p.nombre).includes(n) || normal(p.codigo).includes(n) || normal(p.categoria).includes(n)).slice(0, 8);
}
function agregarAlCarrito(pid, cant = 1) {

function teclaBusqueda(ev) {
  if (ev.key === 'ArrowDown' && sugerencias.length) { ev.preventDefault(); sugSel = (sugSel + 1) % sugerencias.length; pintarSugerencias(); }

}

  let campos = '';

  else if (cobro.medio === 'TRANSFERENCIA') campos = campo('Referencia de la transferencia (opcional)', `<input id="c-ref" placeholder="Ej.: número de comprobante">`) + `<div id="c-info"></div>`;

function actualizarCobro() {
  const total = totalCarrito(E, carrito), info = $('c-info'), btn = $('btn-confirmar'); if (!btn) return;
  let puede = true, html = '';
  if (cobro.modo === 'CREDITO') {
    const c = cli(E, Number(cobro.clienteId));
    if (!c) { puede = false; html = ''; }
    else if (!c.credito) { puede = false; html = `<div class="error-caja">${esc(c.nombre)} no tiene crédito habilitado.</div>`; }
    else {
      const deuda = saldoCliente(E, c.id), disp = creditoDisponible(E, c), queda = deuda + total;
      puede = total <= disp;
      html = `<div class="papel"><div class="f"><span>Límite de crédito</span><b>${pesos(c.limite)}</b></div><div class="f"><span>Debe actualmente</span><b>${pesos(deuda)}</b></div><div class="f"><span>Crédito disponible</span><b>${pesos(disp)}</b></div><hr><div class="f"><span>Con esta venta debería</span><b>${pesos(queda)}</b></div><div class="f"><span>Plazo para pagar</span><b>${c.plazo} días</b></div></div>`
        + (puede ? '' : `<div class="error-caja" style="margin-top:10px">Esta venta supera el crédito disponible por ${pesos(total - disp)}.</div>`);
    }
  } else if (cobro.medio === 'EFECTIVO') {
    const r = val('c-recibido') === '' ? total : Number(val('c-recibido')); puede = r >= total;
    html = puede ? `<div class="ok-caja">Cambio a devolver: <b>${pesos(r - total)}</b></div>` : `<div class="error-caja">Faltan ${pesos(total - r)} para completar el pago.</div>`;
  } else if (cobro.medio === 'MIXTO') {
    const s = Number(val('c-efectivo') || 0) + Number(val('c-transf') || 0); puede = s === total;
    html = puede ? '<div class="ok-caja">El pago mixto suma el total.</div>' : `<div class="error-caja">${s < total ? 'Faltan' : 'Sobran'} ${pesos(Math.abs(total - s))}: efectivo + transferencia deben sumar ${pesos(total)}.</div>`;
  }
  if (info) info.innerHTML = html; btn.disabled = !puede;
}
function confirmarCobro() {
  const total = totalCarrito(E, carrito);
  const datos = { carrito: clonar(carrito), tipo: cobro.modo, clienteId: Number(cobro.clienteId) || null, medio: cobro.medio };
  if (cobro.modo === 'CONTADO' && cobro.medio === 'EFECTIVO') datos.recibido = val('c-recibido') === '' ? total : Number(val('c-recibido'));
  if (cobro.medio === 'MIXTO' && cobro.modo === 'CONTADO') { datos.efectivo = Number(val('c-efectivo') || 0); datos.transferencia = Number(val('c-transf') || 0); }
  const r = cobrarVenta(E, datos); aplicar(r);
  const recibido = datos.recibido; carrito = []; sugerencias = [];
  mostrarTicket(r.venta, { nuevaVenta: true, cambio: recibido != null ? recibido - r.venta.total : null });
  if (seccion === 'pos') pintarTicket();
}

/* ===================================== ACCIONES Y EVENTOS ===================================== */
const TABLAS = { ventas: tablaVentas, productos: tablaProductos, inventario: tablaInventario, movimientos: tablaMovimientos, clientes: tablaClientes, creditos: tablaCreditos, pedidos: tablaPedidos };
const repintar = clave => { const el = $('tabla-' + clave); if (el && TABLAS[clave]) el.innerHTML = TABLAS[clave](); };
const terminar = (mensaje) => { cerrarModal(); if (mensaje) aviso(mensaje); render(); };

const ACCIONES = {
  ir: d => ir(d.id),
  filtro: d => { FILTROS[d.clave][d.campo] = d.valor; render(); },
  'cerrar-modal': () => { cerrarModal(); if (seccion === 'pos' && $('pos-q')) $('pos-q').focus(); },
  imprimir: () => window.print(),

  'cobrar-contado': () => abrirCobro('CONTADO'), 'cobrar-credito': () => abrirCobro('CREDITO'),
  'cobro-modo': d => { cobro.modo = d.modo; $('modal-cuerpo').innerHTML = cuerpoCobro(); actualizarCobro(); },
  'cobro-medio': d => { cobro.medio = d.medio; $('modal-cuerpo').innerHTML = cuerpoCobro(); actualizarCobro(); },
  'confirmar-cobro': () => confirmarCobro(),
  mas: d => { agregarAlCarrito(Number(d.pid), 1); }, menos: d => { const l = carrito.find(x => x.productoId === Number(d.pid)); if (l && --l.cantidad <= 0) carrito = carrito.filter(x => x !== l); pintarTicket(); },
  quitar: d => { carrito = carrito.filter(x => x.productoId !== Number(d.pid)); pintarTicket(); },
  'elegir-sug': d => agregarDesdeBusqueda(prod(E, Number(d.pid))),
  'ver-venta': d => mostrarTicket(E.ventas.find(v => v.id === Number(d.id))),
  /* productos e inventario */
  'nuevo-producto': () => abrirProducto(null), 'editar-producto': d => abrirProducto(Number(d.id)),
  'guardar-producto': d => {
    const r = guardarProducto(E, { id: Number(d.id) || undefined, nombre: val('f-nombre'), codigo: val('f-codigo'), categoria: val('f-cat').trim(), precioCompra: val('f-pc'), precioVenta: val('f-pv'), minimo: val('f-min'), vence: marcado('f-vence'), stockInicial: val('f-stock') });
    aplicar(r); terminar(d.id ? 'Producto actualizado.' : `Producto «${r.producto.nombre}» registrado.`);
  },
  'entrada-producto': d => abrirEntrada(d.id), 'nuevo-lote': () => abrirEntrada(null, true), 'salida-producto': () => abrirSalida(),
  'guardar-entrada': () => { const r = registrarEntrada(E, { productoId: Number(val('e-prod')), cantidad: val('e-cant'), lote: val('e-codigo'), vence: val('e-vence'), nota: val('e-nota') }); aplicar(r); terminar('Entrada registrada: el inventario ya se actualizó.'); },
  'guardar-salida': () => { const r = registrarSalida(E, { productoId: Number(val('s-prod')), cantidad: val('s-cant'), motivo: val('s-motivo') }); aplicar(r); terminar('Salida registrada.'); },
  /* clientes y créditos */
  'nuevo-cliente': () => abrirCliente(null), 'editar-cliente': d => abrirCliente(Number(d.id)),
  'guardar-cliente': d => { const r = guardarCliente(E, { id: Number(d.id) || undefined, nombre: val('k-nombre'), telefono: val('k-tel'), credito: marcado('k-credito'), limite: val('k-limite'), plazo: val('k-plazo') }); aplicar(r); terminar(d.id ? 'Cliente actualizado.' : `Cliente «${r.cliente.nombre}» registrado.`); },
  abonar: d => abrirAbono(d.id), 'abono-todo': d => { $('a-valor').value = d.saldo; },
  'guardar-abono': d => { const r = registrarAbono(E, Number(d.id), val('a-valor')); aplicar(r); terminar(saldoDe(r.cuenta) === 0 ? 'Cuenta pagada por completo. ✅' : `Abono registrado. Saldo pendiente: ${pesos(saldoDe(r.cuenta))}.`); },
  'ver-credito': d => verCredito(d.id),
  /* ampliación CR-02 */
  'nuevo-proveedor': () => abrirProveedor(null), 'editar-proveedor': d => abrirProveedor(d.id),
  'guardar-proveedor': d => { aplicar(guardarProveedor(E, { id: Number(d.id) || undefined, nombre: val('v-nombre'), contacto: val('v-contacto'), telefono: val('v-tel'), entregaDias: val('v-dias') })); terminar('Proveedor guardado.'); },
  'nuevo-pedido': () => abrirPedido(),
  'agregar-linea-pedido': () => { lineasPedido.push({ productoId: E.productos[0].id, cantidad: 1 }); const p = val('p-prov'); $('modal-cuerpo').innerHTML = cuerpoPedido(); if (p) $('p-prov').value = p; },
  'quitar-linea-pedido': d => { lineasPedido.splice(Number(d.i), 1); const p = val('p-prov'); $('modal-cuerpo').innerHTML = cuerpoPedido(); if (p) $('p-prov').value = p; },
  'guardar-pedido': () => { aplicar(crearPedido(E, { proveedorId: Number(val('p-prov')), lineas: lineasPedido.map(l => ({ productoId: Number(l.productoId), cantidad: Number(l.cantidad) })) })); terminar('Pedido enviado. Las alertas de stock bajo ya lo muestran como pendiente.'); },
  'recibir-pedido': d => abrirRecibir(d.id),
  'guardar-recepcion': d => { const ped = E.pedidos.find(p => p.id === Number(d.id)), ven = {}; ped.lineas.forEach(l => { const e = $('r-vence-' + l.productoId); if (e) ven[l.productoId] = e.value; }); aplicar(recibirPedido(E, ped.id, ven)); terminar('Pedido recibido: el inventario se actualizó.'); },
  'cancelar-pedido': d => { if (!confirm('¿Cancelar este pedido?')) return; aplicar(cancelarPedido(E, Number(d.id))); render(); },
  'cerrar-corte': () => { aplicar(cerrarCorte(E, { fecha: hoyISO(), inicial: val('cc-inicial'), contado: val('cc-contado') })); aviso('Corte del día cerrado.'); render(); },
  /* configuración */
  'guardar-config': () => {
    const dias = Number(val('cf-dias')), plazo = Number(val('cf-plazo'));
    exigir(Number.isInteger(dias) && dias >= 0, 'Los días de aviso deben ser un número entero (0 o más)'); exigir(Number.isInteger(plazo) && plazo > 0, 'El plazo debe ser de al menos 1 día');
    E = clonar(E); E.config.diasAviso = dias; E.config.plazoDefecto = plazo; E.config.mostrarAmpliacion = marcado('cf-amp'); guardarEstado(E);
    if (!E.config.mostrarAmpliacion && ['proveedores', 'pedidos', 'caja'].includes(seccion)) seccion = 'config'; pintarMenu(); render(); aviso('Configuración guardada.');
  },
  restablecer: () => { if (!confirm('¿Volver a los datos de ejemplo? Se perderán los cambios hechos en este navegador.')) return; E = datosDeEjemplo(); carrito = []; guardarEstado(E); ir('dashboard'); aviso('Datos de ejemplo restablecidos.'); },
  exportar: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(E, null, 2)], { type: 'application/json' })); a.download = `tiendas_sm_datos_${hoyISO()}.json`; a.click(); URL.revokeObjectURL(a.href); },
};
const ENTRADAS = {
  'pos-buscar': el => { sugerencias = buscarProductos(el.value); sugSel = 0; pintarSugerencias(); },
  'cobro-vivo': () => actualizarCobro(),
  'filtro-texto': el => { FILTROS[el.dataset.clave].texto = el.value; repintar(el.dataset.clave); },
  'linea-pedido': el => { lineasPedido[Number(el.dataset.i)][el.dataset.campo] = el.value; },
  'corte-vivo': () => actualizarCorte(),
};
const CAMBIOS = {
  'cobro-cliente': el => { cobro.clienteId = el.value; actualizarCobro(); },
  'filtro-select': el => { FILTROS[el.dataset.clave][el.dataset.campo] = el.value || 'todas'; repintar(el.dataset.clave); },
  'entrada-producto-cambio': el => { $('e-lote').classList.toggle('oculto', !prod(E, Number(el.value)).vence); },
  'linea-pedido': el => { lineasPedido[Number(el.dataset.i)][el.dataset.campo] = Number(el.value); },
  'por-confirmar': el => { E = clonar(E); E.porConfirmar[el.dataset.i] = el.checked; guardarEstado(E); render(); },
};
function teclado(ev) {
  if (ev.key === 'Escape') { if (modalAbierto) { ACCIONES['cerrar-modal'](); } else if (seccion === 'pos' && $('pos-q')) { $('pos-q').value = ''; sugerencias = []; pintarSugerencias(); } return; }
  if (ev.target && ev.target.id === 'pos-q') teclaBusqueda(ev);
  if (modalAbierto || seccion !== 'pos') return;
  if (ev.key === 'F2') { ev.preventDefault(); $('pos-q').focus(); }
  else if (ev.key === 'F9') { ev.preventDefault(); abrirCobro('CONTADO'); }
  else if (ev.key === 'F4') { ev.preventDefault(); abrirCobro('CREDITO'); }
}
function arrancar() {
  const protegido = f => ev => { try { f(ev); } catch (e) { manejarError(e); } };
  document.addEventListener('click', protegido(ev => {
    const el = ev.target.closest('[data-accion]'); if (el && ACCIONES[el.dataset.accion]) { ACCIONES[el.dataset.accion](el.dataset, el, ev); return; }
    if (seccion === 'pos' && sugerencias.length && !ev.target.closest('.pos-busca')) { sugerencias = []; pintarSugerencias(); }
  }));
  document.addEventListener('input', protegido(ev => { const el = ev.target.closest('[data-entrada]'); if (el && ENTRADAS[el.dataset.entrada]) ENTRADAS[el.dataset.entrada](el, ev); }));
  document.addEventListener('change', protegido(ev => { const el = ev.target.closest('[data-cambio]'); if (el && CAMBIOS[el.dataset.cambio]) CAMBIOS[el.dataset.cambio](el, ev); }));
  document.addEventListener('keydown', protegido(teclado));
  pintarMenu(); render();
}

</script>
<script>arrancar();</script>
